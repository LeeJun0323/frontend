<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품주문</title>
  </head>
  <body>
    <h1>운동화 주문하기</h1>
    <form action="">
      <fieldset>
        <legend>사이즈 선택</legend>
        <label><input type="radio" name="size" id="" checked /> 250mm</label>
        <label><input type="radio" name="size" id="" checked /> 260mm</label>
        <label><input type="radio" name="size" id="" checked /> 270mm</label>
      </fieldset>
      <fieldset>
        <legend>색상 선택</legend>
        <label>색상 : </label>
        <select name="" id="">
          <optgroup label="어두운 색">
            <option value="black">블랙</option>
            <option value="navy">네이비</option>
          </optgroup>
          <optgroup label="밝은 색">
            <option value="white">화이트</option>
            <option value="beige">베이지</option>
          </optgroup>
        </select>
      </fieldset>
      <fieldset>
        <legend>배송지</legend>
        <select name="" id="">
          <option value="서울">서울</option>
          <option value="부산">부산</option>
          <option value="대구">대구</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>요청사항</legend>
        <textarea
          name=""
          id=""
          cols="30"
          rows="10"
          placeholder="배송 시 요청사항을 입력하세요"
        ></textarea>
      </fieldset>
      <button type="submit">주문하기</button>
      <button type="reset">초기화</button>
    </form>
  </body>
</html>
