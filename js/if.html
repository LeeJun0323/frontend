<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 브라우저에서 제공하는 함수
      // parseInt() => 정수로 만들어버림, Number() => 소수가 그대로 유지됨
      const num = parseInt(prompt("숫자 입력"));
      console.log(num);
      console.log(typeof num);
      if (num > 0) {
        console.log("양수");
      } else if (num === 0) {
        console.log("0");
      } else {
        console.log("음수");
      }
    </script>
  </body>
</html>
