<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .navbar {
        background-color: lightgray;
        height: 80px;
      }
      .container-fluid {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      span {
        cursor: pointer;
      }
      .navbar-brand {
        width: 100px;
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .badge {
        padding: 10px;
        margin-right: 20px;
        border-radius: 10px;
        background-color: black;
        color: white;
      }
      .bg-light {
        background-color: white;
        color: black;
      }
      .bg-dark {
        background-color: rgb(0, 0, 0);
        color: white;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container-fluid">
        <span class="navbar-brand">JSShop</span>
        <span class="badge bg-dark">Dark 🔄️</span>
      </div>
    </nav>
    <script>
      // Dark 🔄️ <=> Light 🔄️
      // body background 변경 클래스명을 이용(classList => add(), replace(), toggle(), remove())
      const badge = document.querySelector(".badge.bg-dark");
      const body = document.body;
      badge.addEventListener("click", () => {
        body.classList.toggle("bg-dark");
        if (badge.classList.contains("bg-dark")) {
          badge.classList.replace("bg-dark", "bg-light");
          badge.innerHTML = "Light 🔄️";
        } else {
          badge.classList.replace("bg-light", "bg-dark");
          badge.innerHTML = "Dark 🔄️";
        }
      });
    </script>
  </body>
</html>
